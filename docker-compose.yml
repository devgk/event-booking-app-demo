version: '3'

services:
  # PHP Service
  app:
    build: .
    container_name: event-booking-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - app-network
    ports:
      - "9000:9000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=event_booking_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: event-booking-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: event_booking_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    ports:
      - "3306:3306"

  # Nginx Service (Optional)
  nginx:
    image: nginx:alpine
    container_name: event-booking-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    depends_on:
      - app
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
